<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEMU｜城市故事劇場</title><link rel="stylesheet" href="style.css"></head><body>
<div class="sky" aria-hidden="true"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="city" id="city"></div></div>
<header><a class="brand" href="#">GEMU<span>城市故事劇場</span></a><button id="database" class="outline">▦ 進入資料庫</button></header>
<main><div class="intro"><span class="eyebrow">GEMU / THE CITY PLAYS DIRTY.</span><h1>究竟是<br>命運的安排<span class="headline-joker"><img src="joker.svg" alt="Joker 撲克牌"></span></h1><p>選擇你的角色，走進劇本。下一幕，由命運決定。</p></div>
<section id="game"><div class="selectors"><article><div class="sectiontitle"><span class="step">01</span><h2>選擇角色</h2></div><button class="category" id="charCategory">城市居民 <span>查看角色 →</span></button><div id="characters" class="list" hidden></div></article><article><div class="sectiontitle"><span class="step">02</span><h2>選擇劇本</h2></div><button class="category" id="scriptCategory">城市奇遇 <span>查看劇本 →</span></button><div id="scripts" class="list" hidden></div></article><div class="launch"><p id="selection">選好角色與劇本，就能開始冒險</p><button id="start" disabled>套入劇本 ↗</button></div></div>
<article class="stage"><div class="sectiontitle"><span class="eyebrow">THE STORY STAGE</span><span class="tag">故事放映中</span></div><div id="story"><div class="empty"><div class="stageicon"><img src="joker.svg" alt="Joker 撲克牌"></div><h2>每一個選擇，都是故事的開始</h2><p>從左側挑選登場角色與劇本<br>在這裡瀏覽照片、閱讀劇情，轉動命運。</p><span class="pill">角色 × 劇本 × 命運</span></div></div></article></section>
<section id="db" hidden><div class="dbhead"><div><span class="eyebrow">YOUR STORY LIBRARY</span><h2>資料庫工作室</h2><p>編輯內容儲存在此瀏覽器；匯出後可更新 GitHub 資料庫。</p></div><button id="back" class="outline">← 返回遊戲</button></div><div class="toolbar"><button id="export">↓ 匯出整包 JSON</button><label class="outline upload">↑ 匯入 JSON<input type="file" id="import" accept="application/json" hidden></label><button id="downloadFiles" class="outline">下載 GitHub 分檔</button></div><p id="notice" role="status"></p><div class="forms"><form id="charForm"><h3>新增角色</h3><label>角色名稱<input name="name" required maxlength="80"></label><label>大分類<input name="category" value="城市居民" required></label><label>既定分數（抽籤權重）<input name="score" type="number" min="0" max="1000000" value="10" required></label><label>照片網址<input name="photo" type="url" placeholder="https://…"></label><label>或上傳照片<input name="image" type="file" accept="image/*"></label><label>角色介紹<textarea name="description" required></textarea></label><button>＋ 儲存角色</button></form><form id="scriptForm"><h3>新增劇本</h3><label>劇本名稱<input name="name" required maxlength="80"></label><label>大分類<input name="category" value="城市奇遇" required></label><label>上半段<textarea name="first" placeholder="使用 {{角色}} 插入登場角色名稱" required></textarea></label><label>下半段<textarea name="second" placeholder="使用 {{角色}} 和 {{命運角色}} 套入抽籤結果" required></textarea></label><label>抽出角色數<input name="count" type="number" min="1" value="1" required></label><label>抽籤角色 ID（逗號分隔；留空代表所有角色）<input name="eligible"></label><label>角色演變（每行「角色ID|演變內容」）<textarea name="evolutions"></textarea></label><button>＋ 儲存劇本</button></form></div><div id="records"></div></section>
<div class="street-strip" role="img" aria-label="城市街道，一台 GEMU 箱型車行駛在路上"></div><footer><span>GEMU / 城市故事劇場</span><span>每個平凡角色，都有不平凡的下一幕。</span></footer></main><script src="app.js"></script></body></html>
